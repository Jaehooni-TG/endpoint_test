# Parameters for MoveIt Servo controlling the SO-ARM101 arm

use_gazebo: false

# Incoming command properties
command_in_type: "speed_units"
scale:
  linear: 1.6
  rotational: 4.5
  joint: 3.5

# Outgoing command properties
publish_period: 0.004  # 250 Hz (stable, recommended)
low_latency_mode: true
command_out_type: trajectory_msgs/JointTrajectory
publish_joint_positions: true
publish_joint_velocities: true
publish_joint_accelerations: false
smoothing_filter_plugin_name: "online_signal_smoothing::ButterworthFilterPlugin"
# Use Servo's own planning scene monitor to ensure consistent scene/state
is_primary_planning_scene_monitor: true

# MoveIt frames/groups
move_group_name: arm
planning_frame: base
ee_frame_name: gripper
robot_link_command_frame: base

# Halt behaviour
incoming_command_timeout: 0.25  # 명령 중단시 자동 HALT/복구 동작을 위해 소폭 설정
num_outgoing_halt_msgs_to_publish: 4
# When a joint hits limits in Cartesian mode, only stop that joint, let others move
halt_all_joints_in_joint_mode: true
halt_all_joints_in_cartesian_mode: false

# Singularities / joint limits
lower_singularity_threshold: 60.0
hard_stop_singularity_threshold: 65.0
# Make JOINT_BOUND band very thin so we can use 거의 전체 관절 범위
joint_limit_margin: 0.002
leaving_singularity_threshold_multiplier: 1.3

# Topics (use absolute names to avoid namespace issues)
cartesian_command_in_topic: /servo_node/delta_twist_cmds
joint_command_in_topic: /servo_node/delta_joint_cmds
joint_topic: /joint_states
status_topic: /servo_node/status
command_out_topic: /arm_controller/joint_trajectory
status_publish_period: 0.05

# Collision checking
# 고성능 튜닝: 충돌검사 비활성화(시뮬에서만 권장). 안정화 후 true로 복귀 권장
check_collisions: false
collision_check_rate: 50.0
self_collision_proximity_threshold: 0.03
scene_collision_proximity_threshold: 0.03
